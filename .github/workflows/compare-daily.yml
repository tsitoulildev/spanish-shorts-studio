name: Country comparison Shorts (3 per day)
# One Short per run: pick the slot's pair, synthesise the Spanish voice lines, render, upload to the channel (YT_* secrets), record it.
# A push to the branch cmp-preview only renders samples and stores them on the branch cmp-previews (no upload).
on:
  schedule:
    - cron: "10 7 * * *"
    - cron: "10 13 * * *"
    - cron: "10 18 * * *"
  workflow_dispatch:
    inputs:
      index: { description: "Slot index override (empty = from the clock)", default: "" }
  push:
    branches: [cmp-preview]
concurrency:
  group: compare-daily
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AMBIENT_YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      AMBIENT_YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      AMBIENT_YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      AMBIENT_YT_PRIVACY: ${{ vars.COMPARE_YT_PRIVACY || 'private' }}
      PREVIEW: ${{ github.event_name == 'push' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with: { path: ~/.cache/piper, key: piper-es-ar-daniela-high }
      - name: Install
        run: pip install numpy scipy pillow requests piper-tts && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Preview samples
        if: env.PREVIEW == '1'
        run: |
          set -e
          mkdir -p /tmp/prev
          for p in "ESP MEX 11" "ARG BRA 12"; do
            set -- $p
            bash compare/voices.sh $1 $2 $3 /tmp/v_$1_$2
            python3 compare/render.py $1 $2 --seed $3 --voices /tmp/v_$1_$2 --out /tmp/prev/$1_$2.mp4
          done
          git config user.name github-actions; git config user.email actions@github.com
          git checkout -q --orphan cmp-previews; git rm -rqf .; cp /tmp/prev/*.mp4 .; git add -A; git commit -qm previews; git push -f origin cmp-previews
      - name: Pick slot
        if: env.PREVIEW == '0'
        id: slot
        run: |
          set -eu
          if [ -n "${{ inputs.index }}" ]; then idx="${{ inputs.index }}"; else
            h=$(date -u +%H); case "$h" in 0[0-9]|1[0-1]) s=0;; 1[2-6]) s=1;; *) s=2;; esac
            idx=$(cd compare && python3 -c "import datetime as d,plan as p;print(p.slot_index(d.datetime.utcnow(),$s))")
          fi
          (cd compare && python3 plan.py "$idx") > /tmp/plan.json
          id=$(python3 -c "import json;print(json.load(open('/tmp/plan.json'))['id'])")
          git fetch -q origin compare-ledger 2>/dev/null && git show FETCH_HEAD:ledger.txt > /tmp/ledger.txt 2>/dev/null || : > /tmp/ledger.txt
          if grep -q "^$id " /tmp/ledger.txt; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "already uploaded: $id"; else echo "skip=0" >> "$GITHUB_OUTPUT"; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"; cat /tmp/plan.json
      - name: Voice and render
        if: env.PREVIEW == '0' && steps.slot.outputs.skip == '0'
        run: |
          set -e
          read a b seed < <(python3 -c "import json;p=json.load(open('/tmp/plan.json'));print(p['a'],p['b'],p['seed'])")
          bash compare/voices.sh $a $b $seed /tmp/voices
          python3 compare/render.py $a $b --seed $seed --voices /tmp/voices --out out.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 out.mp4
      - name: Upload
        if: env.PREVIEW == '0' && steps.slot.outputs.skip == '0'
        id: up
        working-directory: ambient_studio
        run: |
          vid=$(python3 -m ambient.upload ../out.mp4 "$(cat /tmp/plan.json)")
          echo "video=$vid" >> "$GITHUB_OUTPUT"; echo "uploaded $vid"
      - name: Record in ledger
        if: env.PREVIEW == '0' && steps.up.outputs.video != ''
        run: |
          echo "${{ steps.slot.outputs.id }} ${{ steps.up.outputs.video }}" >> /tmp/ledger.txt
          git config user.name github-actions; git config user.email actions@github.com
          git checkout -q --orphan compare-ledger; git rm -rqf .; cp /tmp/ledger.txt ledger.txt; git add ledger.txt; git commit -qm "ledger ${{ steps.slot.outputs.id }}"; git push -f origin compare-ledger
