name: Voice audition

# Renders the same Spanish text with every candidate voice (Kokoro, all Spanish Piper voices, a few reference voices)
# so a person can listen and choose. Samples go to the `voices/` folder of the `renders` branch. Nothing is published.
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/voice_audition.py"
      - ".github/workflows/voices.yml"

concurrency:
  group: voice-audition
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audition:
    permissions:
      contents: write   # only to push the `renders` branch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-v1

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --quiet kokoro soundfile numpy piper-tts edge-tts

      - name: Render samples
        run: python scripts/voice_audition.py output/voices

      - name: Publish samples to the renders branch
        if: always()
        run: |
          set -u
          shopt -s nullglob
          files=(output/voices/*.mp3 output/voices/index.json)
          if [ ${#files[@]} -eq 0 ]; then echo "nothing to publish"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin renders:renders 2>/dev/null || true
          if git rev-parse --verify renders >/dev/null 2>&1; then
            git worktree add /tmp/rw renders
          else
            git worktree add --detach /tmp/rw
            (cd /tmp/rw && git checkout -q --orphan renders && git rm -rqf --ignore-unmatch . )
          fi
          mkdir -p /tmp/rw/voices && rm -f /tmp/rw/voices/*
          cp "${files[@]}" /tmp/rw/voices/
          cd /tmp/rw
          git add -A voices
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "voices: audition samples from ${GITHUB_SHA::7}"
          git push origin HEAD:renders
