name: Ambient previews
on:
  push:
    branches: [ambient-themes]
permissions:
  contents: write
jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: timeout 3000 python3 scripts_sheets.py 2>&1 | tee /tmp/sheets.log
        continue-on-error: true
      - name: Publish
        if: always()
        run: |
          mkdir -p /tmp/o; cp /tmp/sheets/sheet_* /tmp/o/; cp /tmp/sheets.log /tmp/o/
          git config user.name github-actions; git config user.email actions@github.com
          git checkout -q --orphan ambient-sheets; git rm -rqf .; cp /tmp/o/* .; git add -A; git commit -qm sheets; git push -f origin ambient-sheets
