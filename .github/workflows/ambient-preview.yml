name: Ambient clip library
on:
  push:
    branches: [ambient-themes]
permissions:
  contents: write
jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy scipy && sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: timeout 16000 python3 scripts_clips.py 2>&1 | tee clips.log; true
      - name: Publish
        if: always()
        run: |
          git config user.name github-actions; git config user.email actions@github.com
          cp clips.log clips/ 2>/dev/null || true
          git add -A clips; git commit -qm "clips (final)" || true; git push -f origin HEAD:refs/heads/ambient-clips
