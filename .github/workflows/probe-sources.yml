name: Probe themes
on:
  push:
    branches: [probe-themes]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts_probe2.py | tee results2.txt
      - run: |
          mkdir -p /tmp/o; cp results2.txt /tmp/o/
          git config user.name github-actions; git config user.email actions@github.com
          git checkout -q --orphan probe-themes-results; git rm -rqf .; cp /tmp/o/* .; git add -A; git commit -qm "theme results"; git push -f origin probe-themes-results
