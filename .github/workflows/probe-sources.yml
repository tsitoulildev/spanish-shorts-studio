name: Probe free sources
on:
  push:
    branches: [probe-sources]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        run: python3 scripts_probe.py | tee results.txt
      - name: publish results
        run: |
          mkdir -p /tmp/o; cp results.txt /tmp/o/; cp p.jpg /tmp/o/ 2>/dev/null || true
          git config user.name github-actions; git config user.email actions@github.com
          git checkout -q --orphan probe-results; git rm -rqf .; cp /tmp/o/* .; git add -A; git commit -qm "probe results"; git push origin probe-results
